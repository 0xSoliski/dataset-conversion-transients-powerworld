name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run dataset-dependent verification when the Zenodo payload is present
        shell: bash
        run: |
          if [[ -f datasets/psse-via-dnns/original/pypower-ieee118/combined_dataset.mat ]]; then
            python tools/psse-verification/verify.py
            python tools/build_scenario_manifest.py --check
            python tools/build_release_manifest.py --check
          else
            echo "Zenodo payload is not part of the GitHub checkout; dataset-dependent checks skipped."
          fi
